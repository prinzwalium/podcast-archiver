services:
  podcast-archiver:
    image: ghcr.io/prinzwalium/podcast-archiver:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: "1000"   # run as this UID (Unraid convention; matches file ownership on /data)
      PGID: "1000"
      # UMASK: "022"  # optional: file permission mask for downloaded files
      # PA_MEDIA_DIR: "/media"   # optional: store episodes separate from the DB
      PA_SECRET_KEY: "change-me-openssl-rand-hex-32"
      PA_EXTERNAL_URL: "https://archiver.example.com"
      # --- OIDC via Authentik (optional; omit for single-user local mode) ---
      # PA_OIDC_ISSUER: "https://authentik.example.com/application/o/podcast-archiver/"
      # PA_OIDC_CLIENT_ID: "changeme"
      # PA_OIDC_CLIENT_SECRET: "changeme"
      # --- Tunables ---
      # PA_SYNC_INTERVAL: "6h"
      # PA_MAX_EPISODE_BYTES: "1073741824"
    volumes:
      - ./data:/data
      # Optional: keep the (large) media archive on a separate bind mount
      # - /mnt/cache/media/podcast-archiver:/media
