{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Podcast Archiver</title>
<style>
:root { --fg:#1c2333; --muted:#6b7280; --bg:#f7f8fa; --card:#fff; --border:#e5e7eb; --accent:#2563eb; --danger:#dc2626; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
header { background:var(--card); border-bottom:1px solid var(--border); padding:0.8rem 1.2rem; display:flex; align-items:center; justify-content:space-between; }
header a { color:var(--fg); text-decoration:none; font-weight:700; }
main { max-width:960px; margin:1.5rem auto; padding:0 1rem; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem 1.2rem; margin-bottom:1rem; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:0.5rem 0.4rem; border-bottom:1px solid var(--border); font-size:0.92rem; }
input[type=text],input[type=url] { width:100%; padding:0.5rem; border:1px solid var(--border); border-radius:6px; font-size:1rem; }
button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:0.5rem 1rem; font-size:0.95rem; cursor:pointer; }
button.danger { background:var(--danger); }
a.btn { display:inline-block; margin-top:0.4rem; }
.muted { color:var(--muted); font-size:0.85rem; }
code { background:#eef1f5; padding:0.1rem 0.35rem; border-radius:4px; word-break:break-all; }
form.inline { display:inline; }
</style>
</head>
<body>
<header>
  <a href="/">📼 Podcast Archiver</a>
  <div>
    <span class="muted">{{if .UserName}}{{.UserName}}{{end}}</span>
    {{if .IsAdmin}}<a href="/admin" class="btn" style="color:var(--accent);text-decoration:none">Admin</a>{{end}}
    {{if .AuthEnabled}}<form class="inline" method="POST" action="/auth/logout"><button type="submit">Logout</button></form>{{end}}
  </div>
</header>
<main>
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}
